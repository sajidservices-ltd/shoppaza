<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 64" fill="none">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <filter id="logo3dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#logo3dShadow)">
    <!-- 3D Isometric Parcel Cube -->
    <g transform="translate(6, 6)">
      <!-- Top Face: Brilliant Pure White -->
      <polygon points="26,4 48,16 26,28 4,16" fill="url(#cubeTop)"/>
      <polygon points="21,13 31,8 31,19 21,25" fill="url(#goldRibbon)" fill-opacity="0.9"/>

      <!-- Left Face: Deep Obsidian Black (Maximum contrast with Orange) -->
      <polygon points="4,16 26,28 26,50 4,38" fill="url(#cubeLeft)"/>
      <polygon points="12,20 18,24 18,46 12,42" fill="url(#goldRibbon)" fill-opacity="0.9"/>

      <!-- Right Face: Deep Midnight Slate -->
      <polygon points="26,28 48,16 48,38 26,50" fill="url(#cubeRight)"/>
      <polygon points="34,24 40,20 40,42 34,46" fill="url(#goldRibbon)" fill-opacity="0.9"/>

      <!-- Razor-Sharp Pure White Seam Lines -->
      <line x1="26" y1="28" x2="26" y2="50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="4" y1="16" x2="26" y2="28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="48" y1="16" x2="26" y2="28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 3D Center Golden Node -->
      <circle cx="26" cy="28" r="3.5" fill="#FFFFFF"/>
      <circle cx="26" cy="28" r="2.2" fill="url(#goldRibbon)"/>
    </g>

    <!-- TYPOGRAPHY: 100% CRYSTAL CLEAR ON ORANGE HEADER -->
    <!-- "SHOP" in Solid Snow White -->
    <text x="68" y="40" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#FFFFFF">
      SHOP<tspan fill="#FFE082">PAZA</tspan>
    </text>

    <!-- Subtitle: Crisp White with Golden Tracking -->
    <text x="70" y="53" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="8.5" letter-spacing="3.5" fill="#FFF3E0">
      WORLDWIDE COMMERCE
    </text>

    <!-- Subtle Gold Accent Sparkle -->
    <circle cx="270" cy="36" r="3.5" fill="#FFE082"/>
  </g>
</svg>