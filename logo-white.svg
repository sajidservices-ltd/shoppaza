<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="cubeTopWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="cubeLeftWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cubeRightWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 3D Isometric Parcel Cube (Vibrant Orange Header Background) -->
  <g transform="translate(6, 6)" filter="url(#shadowDark)">
    <!-- Top Face (Snow White) -->
    <polygon points="26,4 48,16 26,28 4,16" fill="url(#cubeTopWhite)"/>
    <!-- Left Face (Deep Midnight Obsidian) -->
    <polygon points="4,16 26,28 26,50 4,38" fill="url(#cubeLeftWhite)"/>
    <!-- Right Face (Deep Charcoal Slate) -->
    <polygon points="26,28 48,16 48,38 26,50" fill="url(#cubeRightWhite)"/>
    <!-- Central Seam Lines & Node -->
    <line x1="26" y1="28" x2="26" y2="50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="26" y2="28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="48" y1="16" x2="26" y2="28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="26" cy="28" r="3.2" fill="#FFFFFF"/>
    <circle cx="26" cy="28" r="1.8" fill="#FFD166"/>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="41" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#FFFFFF">
    SHOP<tspan fill="#FFE082">PAZA</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="70" y="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="8.5" letter-spacing="3.2" fill="#FFE8CC">
    WORLDWIDE COMMERCE
  </text>
</svg>