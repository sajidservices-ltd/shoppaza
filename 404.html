<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | Shoppaza</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 min-h-screen flex flex-col justify-between">
  <header class="p-6 border-b border-slate-200 bg-white">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html">
        <img src="logo.svg" alt="Shoppaza" class="h-10 w-auto">
      </a>
      <a href="index.html" class="text-xs font-bold text-orange-600 hover:underline">
        Back to Shopping Mall →
      </a>
    </div>
  </header>

  <main class="max-w-lg mx-auto text-center px-4 py-20">
    <div class="w-24 h-24 mx-auto rounded-3xl bg-orange-50 text-orange-500 flex items-center justify-center text-4xl mb-6 shadow-sm">
      <i class="fa-solid fa-compass"></i>
    </div>
    <span class="text-xs uppercase font-extrabold tracking-widest text-orange-600">Error 404</span>
    <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mt-2">Item or Page Not Found</h1>
    <p class="text-xs sm:text-sm text-slate-500 mt-3 leading-relaxed">
      The product or link you are seeking might have been updated, relocated, or expired. Browse our 800+ authentic collections below.
    </p>

    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="index.html" class="w-full sm:w-auto px-6 py-3 bg-orange-600 hover:bg-orange-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-orange-600/20 transition">
        <i class="fa-solid fa-house mr-1.5"></i> Return to Storefront
      </a>
      <a href="contact.html" class="w-full sm:w-auto px-6 py-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold text-xs rounded-xl transition">
        Contact Help Desk
      </a>
    </div>
  </main>

  <footer class="p-6 border-t border-slate-200 text-center text-xs text-slate-500 bg-white">
    © 2026 SAJID SERVICES LTD (SC874640). Shoppaza Global Mega Store.
  </footer>
</body>
</html>
