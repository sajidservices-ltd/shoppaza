<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="cubeTopLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F85606" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <linearGradient id="cubeLeftLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cubeRightLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 3D Isometric Parcel Cube (Light / White Backgrounds) -->
  <g transform="translate(6, 6)" filter="url(#shadowLight)">
    <!-- Top Face -->
    <polygon points="26,4 48,16 26,28 4,16" fill="url(#cubeTopLight)"/>
    <!-- Left Face -->
    <polygon points="4,16 26,28 26,50 4,38" fill="url(#cubeLeftLight)"/>
    <!-- Right Face -->
    <polygon points="26,28 48,16 48,38 26,50" fill="url(#cubeRightLight)"/>
    <!-- Central Seam Lines & Node -->
    <line x1="26" y1="28" x2="26" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="26" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="16" x2="26" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="28" r="3.2" fill="#FFFFFF"/>
    <circle cx="26" cy="28" r="1.8" fill="#F85606"/>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="41" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#0F172A">
    SHOP<tspan fill="#F85606">PAZA</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="70" y="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="8.5" letter-spacing="3.2" fill="#64748B">
    WORLDWIDE COMMERCE
  </text>
</svg>