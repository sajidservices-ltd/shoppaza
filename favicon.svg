<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Squircle Base (Deep Obsidian) -->
  <rect width="64" height="64" rx="16" fill="#0F172A"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- 3D Isometric Parcel Cube -->
  <g transform="translate(6, 6)">
    <!-- Top Face (Snow White) -->
    <polygon points="26,6 48,18 26,30 4,18" fill="#FFFFFF"/>
    <!-- Left Face (Electric Sunset Orange) -->
    <polygon points="4,18 26,30 26,52 4,40" fill="#F85606"/>
    <!-- Right Face (Luminous Amber Gold) -->
    <polygon points="26,30 48,18 48,40 26,52" fill="#FFB800"/>
    
    <!-- Central Seams -->
    <line x1="26" y1="30" x2="26" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="4" y1="18" x2="26" y2="30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="18" x2="26" y2="30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Center Node -->
    <circle cx="26" cy="30" r="3" fill="#FFFFFF"/>
    <circle cx="26" cy="30" r="1.5" fill="#0F172A"/>
  </g>
</svg>